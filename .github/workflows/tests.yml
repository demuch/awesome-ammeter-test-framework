name: tests

on:
  push:
  pull_request:

# The tests only need to read the repository
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Finish every combination even if one fails, to see all platform problems at once
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]
        # Python 3.9 reached end of life in October 2025 and is not built for the newest Ubuntu image;
        # it is kept (the project was developed on 3.9) on the previous Ubuntu release
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # --durations lists the slowest tests, so a slowdown on one platform is visible
        run: python -m pytest --cov=src --cov=Ammeters --cov-report=term-missing --durations=8

      # Smoke tests: the real scripts start and finish without errors on every platform
      - name: Run main.py
        run: python main.py

      - name: Run examples/run_tests.py
        run: python examples/run_tests.py
