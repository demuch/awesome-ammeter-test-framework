[pytest]
testpaths = tests
# Lets the tests import 'src' and 'Ammeters' from the project root
pythonpath = .
# A typo in a marker name is an error, not a silently ignored marker
addopts = --strict-markers
markers =
    integration: uses real sockets and emulator threads (slower); skip with -m "not integration"
# Any warning fails the run, so nothing is hidden; known warnings from third-party code are listed one by one
filterwarnings =
    error
    # matplotlib (3.9, the last release for Python 3.9) calls a pyparsing function that pyparsing 3.3 deprecated
    ignore:'enablePackrat' deprecated
