testing:
  # Set any two of the three values, the third one is computed (count = duration x frequency).
  # If all three are set, they must agree.
  sampling:
    measurements_count: 20
    total_duration_seconds: 2
    sampling_frequency_hz: NULL

# Each ammeter: port and command are required; host (default localhost) and timeout (seconds, default 5) are optional.
# 'emulator' is the import path of the emulator class to start for this ammeter.
# An ammeter without 'emulator' is a real device: nothing is started for it, it is only queried.
ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
    emulator: "Ammeters.Greenlee_Ammeter.GreenleeAmmeter"
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
    emulator: "Ammeters.Entes_Ammeter.EntesAmmeter"
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"
    emulator: "Ammeters.Circutor_Ammeter.CircutorAmmeter"
#  lab_device:
#    host: "192.168.1.50"
#    port: 6000
#    command: "GET_CURRENT"

analysis:
  # Which metrics the report shows; all of them are always computed.
  # Known: mean, median, stdev, min, max, relative_spread. Empty or missing = all.
  statistical_metrics: [mean, median, stdev, min, max, relative_spread]
  # Plots need requirements-plot.txt (matplotlib). enabled: python -m src.run also saves a plot of every
  # archived run. plot_types: panels of a single-run plot, any of values, histogram, response_time, timing;
  # empty or missing = all.
  visualization:
    enabled: true
    plot_types: [values, histogram, response_time, timing]

result_management:
  # Folder for archived runs, one JSON file per run; relative paths start at the project root.
  results_dir: results/runs
  # Whether python -m src.run saves every run to the archive (unless --no-save is given).
  save_results: true
