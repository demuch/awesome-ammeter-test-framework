# The emulators of config.yaml, but misbehaving on purpose, to watch the framework handle failures:
#   python -m src.run --config config/error_simulation.yaml
#
# simulate_errors (emulators only): probability of each fault for a valid command, from 0 to 1, at most 1 in total.
#   error_reply   answer "ERROR: simulated failure"
#   garbage       answer something that is not a number
#   no_reply      close the connection without answering
#   slow_reply    answer correctly after slow_reply_s seconds (default 0.5)
#   seed          optional: the same requests fail on every run
testing:
  sampling:
    measurements_count: 20
    sampling_frequency_hz: 10

ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
    emulator: "Ammeters.Greenlee_Ammeter.GreenleeAmmeter"
    simulate_errors:
      error_reply: 0.1
      garbage: 0.05
      seed: 42
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
    emulator: "Ammeters.Entes_Ammeter.EntesAmmeter"
    simulate_errors:
      no_reply: 0.1
      seed: 42
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"
    emulator: "Ammeters.Circutor_Ammeter.CircutorAmmeter"
    # A reply of 0.3 s at 10 Hz misses the next moment: the timing report shows late measurements
    simulate_errors:
      slow_reply: 0.15
      slow_reply_s: 0.3
      seed: 42

result_management:
  save_results: false
